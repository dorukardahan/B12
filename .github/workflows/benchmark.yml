name: Benchmark (LoCoMo)

on:
  # Manual trigger from the Actions tab.
  workflow_dispatch:
  # Monthly automated run (1st of each month, 00:00 UTC).
  schedule:
    - cron: "0 0 1 * *"
  # Opt-in per-PR run — attach the `bench` label to the PR and the
  # matrix runs against the PR head, posting the 9-cell table as a comment.
  pull_request:
    types: [labeled, synchronize]

jobs:
  matrix:
    name: locomo 9-cell matrix
    runs-on: ubuntu-latest
    # Skip PR runs unless the PR carries the `bench` label.
    if: |
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'bench')
    # ~50-70 min runtime on M-series local; ubuntu-latest is slower for the
    # bge-m3 encode pass. Keep generous headroom past the documented range.
    timeout-minutes: 120
    permissions:
      contents: read
      # PR timeline comments are issue comments under the hood — without
      # `issues: write` the createComment call fails with HTTP 403
      # "Resource not accessible by integration".
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install bench dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install sentence-transformers sqlite-vec numpy

      - name: Run 9-cell matrix
        env:
          B12_BENCH_PYTHON: python3
        run: |
          bash benchmarks/locomo/run_full_matrix.sh \
            benchmarks/locomo/results-ci.json

      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        with:
          name: locomo-results-${{ github.run_id }}
          path: benchmarks/locomo/results-ci.json
          retention-days: 90

      - name: Comment results on PR (label-gated)
        # Skip for fork PRs — GITHUB_TOKEN is read-only on forks and
        # createComment would fail the whole job after the matrix completed.
        if: |
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('benchmarks/locomo/results-ci.json', 'utf8'));
            const cells = data.results;
            const search = ['keyword', 'hybrid', 'vector'];
            const storage = ['observations', 'summaries', 'dialogues'];
            const fmt = (v) => v === undefined ? '—' : v.toFixed(3);
            let table = `### LoCoMo bench — \`${data.version}\` (${data.embed_model}, dim ${data.embed_dim})\n\n`;
            table += '| Storage \\ Search | ' + search.map(s => `**${s}**`).join(' | ') + ' |\n';
            table += '|---|' + search.map(_ => '---').join('|') + '|\n';
            for (const st of storage) {
              const row = search.map(s => {
                const c = cells[`${st}-${s}`] || {};
                return `R@5 ${fmt(c.recall_at_5)} · F1 ${fmt(c.token_f1)}`;
              });
              table += `| **${st}** | ${row.join(' | ')} |\n`;
            }
            table += `\nFull JSON in workflow artifact \`locomo-results-${{ github.run_id }}\`.`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: table,
            });
