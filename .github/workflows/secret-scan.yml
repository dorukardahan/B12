name: secret-scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly full-history rescan to catch anything that slipped past PR gates
    - cron: '0 6 * * 1'

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks-action fetches PR commits (GET /pulls/:n/commits) and, with
      # GITLEAKS_ENABLE_COMMENTS, posts inline comments on findings — both need
      # the pull-requests scope. Without it the action 403s on pull_request
      # events (push/schedule runs have no PR and were unaffected).
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history for scheduled rescans

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fail the workflow on any finding (no GITLEAKS_NOTIFY_USER_LIST set,
          # no GITLEAKS_LICENSE — the action runs in OSS mode for public repos)
          GITLEAKS_ENABLE_COMMENTS: true
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
          GITLEAKS_ENABLE_SUMMARY: true
