name: Feature request
description: Propose a new feature, integration, or design change.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user-visible pain motivated this request? Be specific.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would the feature look like from the user's perspective?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you ruled out, and why.
  - type: textarea
    id: scope
    attributes:
      label: Implementation hints
      description: Files that would change, new env vars, opt-in flags, etc. Optional.
