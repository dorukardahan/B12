name: Bug report
description: Something is broken or behaving unexpectedly.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug report. Please fill in as much detail as you
        can — install state + reproduction steps + observed vs expected.
        **Security issues: do NOT use this form. See [SECURITY.md](../SECURITY.md).**
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: One-paragraph summary.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Numbered steps. Include the AI tool, the prompt, what B12 was supposed to do.
      placeholder: |
        1. Run `./install.sh`
        2. Open Claude Code in `/some/repo`
        3. Ask `/mcp` — expected `B12 · connected`, got `B12 · disconnected`
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Paste output of these commands.
      render: shell
      placeholder: |
        $ git -C /path/to/B12 describe --tags --always
        $ python3 --version
        $ uname -a
        $ ls ~/.B12/hooks/ | head -5
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: From `~/.B12/memory-logs/` if applicable. Redact secrets.
      render: shell
