[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "b12-memory"
version = "11.18.0"
description = "Persistent cross-session memory system for AI coding assistants"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Doruk Ardahan", email = "doruk@dorukardahan.com"}
]
keywords = ["memory", "ai", "coding-assistant", "claude-code", "persistent-memory", "semantic-search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp",
    # BGE-M3 (default embed model, 1024-dim multilingual cls-pooled) ships
    # as PyTorch weights via sentence-transformers. The first SessionStart
    # downloads ~2.2GB once; opt into a smaller GGUF Q8_0/Q4_K_M via
    # B12_EMBED_BACKEND=gguf + the gguf extra below.
    "sentence-transformers",
    "sqlite-vec",
    "fsrs",
]

[project.optional-dependencies]
dev = ["pytest"]
# Smaller-footprint embed backend. Install with:
#   pip install ".[gguf]"
# then download a BGE-M3 GGUF (e.g. nomic-ai/bge-m3-gguf Q8_0) and set
# B12_EMBED_BACKEND=gguf + B12_EMBED_GGUF_PATH=/path/to/model.gguf.
gguf = ["llama-cpp-python>=0.2.20"]

# NOTE: pip install entry point not yet functional — use install.sh for now
# [project.scripts]
# b12 = "b12_memory.cli:main"

[project.urls]
Homepage = "https://github.com/dorukardahan/B12"
Repository = "https://github.com/dorukardahan/B12"
Issues = "https://github.com/dorukardahan/B12/issues"

