[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "b12-memory"
version = "11.81.5"
description = "Persistent cross-session memory system for AI coding assistants"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    {name = "Doruk Ardahan", email = "doruk@dorukardahan.com"}
]
keywords = ["memory", "ai", "coding-assistant", "claude-code", "persistent-memory", "semantic-search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    # Conservative bounds: floor for API stability, ceiling to block a known
    # breaking major from silently installing. Verified against the working
    # b12-venv (mcp 1.26, sentence-transformers 5.2, sqlite-vec 0.1.6, fsrs 6.3).
    "mcp>=1.0,<2",
    # BGE-M3 (default embed model, 1024-dim multilingual cls-pooled) ships
    # as PyTorch weights via sentence-transformers. The first SessionStart
    # downloads ~2.2GB once; opt into a smaller GGUF Q8_0/Q4_K_M via
    # B12_EMBED_BACKEND=gguf + the gguf extra below.
    "sentence-transformers>=2.2,<6",
    "sqlite-vec>=0.1,<0.2",
    "fsrs>=6,<7",
]

[project.scripts]
b12 = "b12_cli:main"

[project.optional-dependencies]
dev = ["pytest"]
trainer = ["setfit>=1.0,<2", "onnx>=1.16,<2", "onnxruntime>=1.17,<2", "skl2onnx>=1.16,<2"]
# Smaller-footprint embed backend. Install with:
#   pip install ".[gguf]"
# then download a BGE-M3 GGUF (e.g. nomic-ai/bge-m3-gguf Q8_0) and set
# B12_EMBED_BACKEND=gguf + B12_EMBED_GGUF_PATH=/path/to/model.gguf.
gguf = ["llama-cpp-python>=0.2.20"]

[project.urls]
Homepage = "https://github.com/dorukardahan/B12"
Repository = "https://github.com/dorukardahan/B12"
Issues = "https://github.com/dorukardahan/B12/issues"

[tool.setuptools]
package-dir = {"" = "scripts"}
py-modules = [
    "antigravity_hook_adapter",
    "antigravity_install",
    "b12_cli",
    "b12_cli_provider",
    "b12_config",
    "b12_embed_quant_eval",
    "b12_gc",
    "b12_health",
    "b12_health_report",
    "b12_importance",
    "b12_ingest_queue",
    "b12_llm_extractor",
    "b12_llm_prompts",
    "b12_llm_providers",
    "b12_long_session",
    "b12_mcp_daemon",
    "b12_mcp_server",
    "b12_pii_scrubber",
    "b12_scheduler",
    "b12_token_budget",
    "build_classifier_corpus",
    "codex_session_end",
    "consolidation_engine",
    "contradiction_resolver",
    "cursor_mdc",
    "dashboard_server",
    "embed_daemon",
    "embedding_backfill",
    "export_import",
    "file_pagerank",
    "graph_enrich",
    "hook_adapter",
    "memory_refine",
    "migrate_ebbinghaus",
    "migrate_embed_to_bge_m3",
    "migrate_fix_metadata",
    "migrate_fsrs",
    "migrate_stemmed_fts",
    "migrate_v10_13",
    "migrate_v12_3_contra_prune",
    "shared_patterns",
    "surfacing_engine",
    "train_classifier",
    "train_classifier_head_pkl",
    "transcript_adapter",
    "write_time_merge",
]

[tool.pytest.ini_options]
# Default test discovery covers both:
#   scripts/tests/  — Python module tests (b12_pii_scrubber, dashboard_server, etc.)
#   tests/hooks/    — Bash hook smoke tests (JSON in → exit 0, graceful degradation)
testpaths = ["scripts/tests", "tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",                    # short summary of all non-pass outcomes
    "--strict-markers",       # typo'd marker = error, not silent skip
    "--strict-config",        # invalid config = error
]
