# B12 Memory System — Codex CLI MCP Server Configuration
# This section is merged into ~/.codex/config.toml by install.sh --codex
#
# Placeholders replaced by installer:
#   __VENV_PYTHON__  → absolute path to b12-venv Python (e.g., /Users/you/.local/b12-venv/bin/python3)
#   __SCRIPT_PATH__  → absolute path to b12_mcp_server.py (e.g., /Users/you/.B12/hooks/scripts/b12_mcp_server.py)

[mcp_servers.B12]
command = "__VENV_PYTHON__"
args = ["__SCRIPT_PATH__"]
enabled = true
startup_timeout_sec = 30

[mcp_servers.B12.env]
MCP_EMBEDDING_MODEL = "BAAI/bge-m3"
MCP_MAX_RESPONSE_CHARS = "40000"

# Round 0 fix #2 — silent-store pattern: skip per-call approval prompt for
# memory_store (B12's batch-write tool). Plan §2 / CX-C5.
[mcp_servers.B12.tools.memory_store]
approval_mode = "auto"
