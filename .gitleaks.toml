# gitleaks config for B12.
#
# Extends the default ruleset (every standard secret rule still runs on real
# source) and allowlists ONLY the secret-scrubber TEST fixtures. Those files
# deliberately contain fake secret patterns (sk-ant-, AKIA, AIza, Stripe keys,
# PEM private-key blocks, DB URIs, ...) — they are the inputs the scrubber unit
# tests assert get redacted, so gitleaks must not treat them as real leaks.
title = "B12 gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "B12 secret-scrubber test fixtures (intentional fake secrets)"
# Fabricated credential string used by the secret-filter tests
# (test_importance_signals.py). Allowlisted BY VALUE so it is ignored no matter
# which file/commit it appears in — surgical (this one fake string only, not any
# whole production file). It briefly lived in b12_importance._selftest in an
# earlier branch commit before being moved test-only; this also keeps that
# historical diff clean across the PR's commit range. Self-allowlisted here too.
regexes = [
  '''sk_live_abc123DEF456ghi789jkl012mno345pqr''',
]
paths = [
  '''scripts/tests/test_b12_pii_scrubber\.py''',
  '''scripts/tests/test_sanitization_hooks\.py''',
  # Phase-2 importance signal tests: assert the secret-suspected filter fires on
  # real credential shapes (sk_live_, ghp_, ...), so the file carries intentional
  # fake secrets — same category as the scrubber fixtures above.
  '''scripts/tests/test_importance_signals\.py''',
  # PR-2c audit test: asserts the audit force-redacts a fake credential even
  # when B12_DISABLE_PII_SCRUB=1, so it carries an intentional fake secret.
  '''scripts/tests/test_audit_importance_gap\.py''',
]
